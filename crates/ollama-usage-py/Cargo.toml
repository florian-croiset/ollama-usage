[package]
name = "ollama-usage-py"
description = "Native part of the ollama-usage Python package."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_ollama_usage"
crate-type = ["cdylib"]

[features]
# Enabled by maturin when building a wheel, which must not link libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
ollama-usage.workspace = true
ollama-usage-cli = { path = "../ollama-usage-cli" }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
serde_json.workspace = true

[lints]
workspace = true
